<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Organizer - Manage Events</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Organizer Dashboard</h1>
    <div>
      <span id="userInfo"></span>
      <button id="logoutBtn">Logout</button>
      <button onclick="window.location.href='index.html'">Back to Home</button>
    </div>
  </header>
  <section class="role-section">
    <h2>Add New Event</h2>
    <form id="addEventForm">
      <input type="text" id="title" placeholder="Title" required />
      <input type="date" id="date" required />
      <input type="text" id="venue" placeholder="Venue" required />
      <textarea id="description" placeholder="Description"></textarea>
      <label for="price" style="display: block; margin-top: 10px; font-weight: 600; color: #353563;">
        Ticket Price (₹)
      </label>
      <input 
        type="number" 
        id="price" 
        placeholder="Enter ticket price (e.g., 499.00)" 
        min="0" 
        step="0.01" 
        required 
        style="width: 100%; padding: 10px; margin-top: 5px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 1rem;"
      />
      <small style="display: block; margin-top: 5px; color: #666;">Enter 0 for free events</small>
      <button type="submit" style="margin-top: 15px;">Add Event</button>
    </form>
  </section>
  <h2>Your Events</h2>
  <div id="eventsContainer"></div>
  <script src="organizer.js"></script>
</body>
</html>
